<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-steps</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        :root {
            --size:256px;
        }
        section {
            div.bg {
                background: url(imgs/bg-steps.png) no-repeat center / cover;
                outline: 4px solid #fff;
                border-radius: 12px;
                corner-shape: squircle;
                position: relative;
                height: 540px;

                div.instructions {
                    background-color: #0009;
                    border-radius: 12px;
                    corner-shape: squircle;
                    color: #fff;
                    text-align: center;
                    outline: 4px dashed #fff;
                    padding: 0.4rem;
                    position: absolute;
                    top: 26px;
                    left: 26px;
                    width: 300px;
                }

                div.trainer {
                    background: url(imgs/steps-all.png) no-repeat;
                    background-position-x: 0;
                    transform: scale(.7);
                    position: absolute;
                    bottom: 20px;
                    left: 50px;
                    height: var(--size);
                    width: var(--size);

                    animation: 0.6s animTrainer steps(4) infinite;

                    &.front {background-position-y: calc(var(--size)*0);}
                    &.left {background-position-y: calc(var(--size)*-1);}
                    &.right {background-position-y: calc(var(--size)*-2);}
                    &.back {background-position-y: calc(var(--size)*-3);}
                }
            }
        }
        @keyframes animTrainer {
            100% { background-position-x: calc(var(--size)* -4);}
        }
    </style>
</head>

<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H107.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L107.31,120H168A8,8,0,0,1,176,128Z"></path></svg>
            </a>
    </nav>
    <main>
        <header class="mmenu internal">
         <h1>40-steps</h1>
           <img src="../03-css/imgs/logo-css.png">
         <h3>Función de tiempo (steps()) utilizada en animaciones CSS para dividir una transición en fotogramas discretos, común en animaciones estilo sprite fotograma a fotograma.</h3>
        </header>
        <section>
                <h3 class="subtitle">Examples:</h3>
                <div class="bg">
                    <div class="instructions">
                        Please press arrow keys: 
                        <br>
                        &larr; &uarr; &rarr; &darr; </div>
                    <div class="trainer front"></div>
                </div>
        </section>
    </main>
    <script>
        const trainer = document.querySelector('.trainer');
        document.addEventListener('keyup', function(e) {
            switch (e.keyCode) {
                case 37: // Left 
                trainer.classList.remove('front', 'rigth', 'back');
                trainer.classList.add('left');
                break;
                case 38: // Top 
                trainer.classList.remove('left', 'rigth', 'back');
                trainer.classList.add('front');
                break;
                case 39: // Right
                trainer.classList.remove('left', 'front', 'back');
                trainer.classList.add('right');
                break;
                case 40: // Bottom
                trainer.classList.remove('left', 'front', 'right');
                trainer.classList.add('back');
                break;
            }
        });
    </script>
</body>

</html>
