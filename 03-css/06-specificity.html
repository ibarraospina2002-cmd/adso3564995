    <style>
        /* Specificity: 0,0,2 => 2 */
        section button {       
            background-color: #ccc;
            border: 2px solid #000;
            padding: 0.8rem;
            display: block;
            margin: 2rem auto;
            width: 240px;}

        /* Specificity: 0,0,2 => 12 */
        section button.green {
            background-color: #59b259;
        }
        /* Specificity: 0,0,2 => 1 */
        button {
            background-color: #dc143c !important;
        }
    </style>
