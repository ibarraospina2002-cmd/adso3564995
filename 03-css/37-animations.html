<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-animations</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        section {
            div.jungle {
                outline: 4px solid #fff9;
                border-radius: 12px;
                corner-shape: squircle;
                background: url(imgs/jungle.png)
                            no-repeat center /contain;
                margin: 1rem auto;
                width: 360px;
                height: 440px;
                position: relative;

                img, 
                div {
                    position:absolute;
                    top: 0px;
                    left: 0;

                    &.logo {
                        top: 34px;
                        left: 24px;
                        animation: 2.8s animLogo infinite ease;
                    }

                    &.dk {
                        top: 170px;
                        left: 110px;
                        width: 140px;
                        animation: 2s animDK infinite ease;
                    }

                    &.move {
                        top: 286px;
                        left: 0px;
                        animation: 2s animAttack infinite ease-out;
                        img.ryno {
                            width: 120px;
                            animation: 1.5s animRyno infinite ease-in;
                        }
                    }
                }
            }
        }
        @keyframes animLogo {
            0%, 100% {
                transform: scale(.8);
            }
            50% {
                transform: scale(1.12);
            }
        }
        @keyframes animDK {
            0% {transform: scale(1)    rotateX(0deg);    top: 170px;}
            48% {transform: scale(.75) rotateX(0deg);    top: 70px;}
            52% {transform: scale(.75) rotateX(180deg);  top: 70px;}
            56% {transform: scale(.75) rotateX(0deg);    top: 70px;}
            70% {transform: scale(1)   rotateX(0deg);    top: 170px;}
            100% {transform: scale(1)  rotateX(0deg);    top: 170px;}
        }
        @keyframes animRyno {
            0%, 100% { transform: translateY(0);}
            50%      { transform: translateY(-12px);}
            
        }

        @keyframes animAttack {
            0% {transform:  rotateY(0deg); top: 286px; left: -110px;}
            24% {transform: rotateY(0deg); top: 286px; left: 150px;}
            28% {transform: rotateY(0deg); top: 186px; left: 120px;}
            32% {transform: rotateY(0deg); top: 286px; left: 120px;}
            49% {transform: rotateY(0deg); top: 286px; left: 380px;}
            50% {transform: rotateY(180deg); top: 286px; left: 380px;}
            100% {transform: rotateY(180deg); top: 286px; left: -10px;}
        }
    </style>
</head>

<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H107.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L107.31,120H168A8,8,0,0,1,176,128Z"></path></svg>
            </a>
    </nav>
    <main>
        <header class="mmenu internal">
         <h1>37-animations</h1>
           <img src="../03-css/imgs/logo-css.png">
         <h3>Lets an element gradually change from one style to another.</h3>
        </header>
        <section>
            <h3 class="subtitle">Example:</h3>
            <div class="jungle">
                <img src="imgs/logo-dk.png" class="logo">
                <img src="imgs/dk.png" class="dk">
                <div class="move">
                    <img src="imgs/ryno.png" class="ryno">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
