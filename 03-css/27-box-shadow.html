<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-box-shadow</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        section {
            div.box {
                border: 4px solid #fff;
                background-color: #caa0f533;
                height: 200px;
                margin: 2rem auto;
                width: 300px;

                &.box1 {
                    box-shadow: 0 0 12px #fff;
                }
                &.box2 {
                    box-shadow: -10px -10px 24px 0 #fff;
                }
                &.box3 {
                    box-shadow: 0 0 20px  #fff inset;
                }
                &.box4 {
                    box-shadow: 4px 4px 0 0 #ffcd00,
                                8px 8px 0 0 #003087,
                                12px 12px 0 0 #c8102e;  
                }
            }
            div.images {
                text-align: center;
                img {
                    width: 160px;

                    &:first-of-type {
                        box-shadow: 0 0 12px  #fff;
                    }
                    &:last-of-type {
                        filter: drop-shadow(0 0 12px #fff);
                    }
                }
            }
        }
    </style>
</head>

<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H107.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L107.31,120H168A8,8,0,0,1,176,128Z"></path></svg>
            </a>
    </nav>
    <main>
        <header class="mmenu internal">
         <h1>27-box-shadow</h1>
           <img src="../03-css/imgs/logo-css.png">
         <h3>Property attaches one or more shadows to an element.</h3>
        </header>
        <section>
            <h2 class="subtitle">box-shadow: 0 0 12px #fff</h2>
            <div class="box box1"></div>
            <h2 class="subtitle">box-shadow: -10px -10px 24px 0 #fff</h2>
            <div class="box box2"></div>
            <h2 class="subtitle">box-shadow: 0 0 20px #fff inset</h2>
            <div class="box box3"></div>
            <h2 class="subtitle">box-shadow: multiple</h2>
            <div class="box box4"></div>
            <h2 class="subtitle">box-shadow VS drop-shadow()</h2>
            <div class="images">
                <img src="imgs/mario.png">
                <img src="imgs/mario.png">
            </div>
        </section>
    </main>
</body>

</html>
