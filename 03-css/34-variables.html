<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>34-variables</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        :root {
            --btn-width: 320px;
            --btn-padding: 0.4rem 0.8rem;
            --primary-color: #3a91ee;
            --secondary-color: #727e8a;
            --primary-border: 4px solid #a3cfff;
            --secondary-border: 4px solid #c5d1dc;
        }
        section {
            button.btn {
                border-radius: 8px;
                corner-shape: sqircle;
                color: #fff;
                display: block;
                margin: 0.4rem auto;
                padding: var(--btn-padding);
                width: var(--btn-width);

                &.btn1 {
                    background: var(--primary-color);
                    border: var(--primary-border);
                }
                &.btn2 {
                    background: var(--secondary-color);
                    border: var(--secondary-border);
                }
            }
        }
    </style>
</head>

                <h3 class="subtitle">Examples:</h3>
