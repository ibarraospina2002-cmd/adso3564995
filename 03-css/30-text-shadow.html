<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-text-shadow</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        section {
            p.txt {
                font-size: 4rem;
                font-weight: 600;
                text-align: center;
                margin: 1rem 0;

                &.txt1 {
                    color: black;
                    text-shadow: 0 0 6px white;
                }
                &.txt2 {
                    color: #000;
                    text-shadow: -4px -4px 4px white;
                }
                &.txt3 {
                    color: #d10a95;
                    text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073, 0 0 40px #e60073, 0 0 50px #e60073, 0 0 60px #e60073, 0 0 70px #e60073;
                }
                &.txt4 {
                    color: white;
                    letter-spacing: 0.6rem;
                    text-shadow: -5px 0 0 #fcdd09,
                                -10px 0 0 #078930;
                }
            }
        }
    </style>
</head>

         <h1>30-text-shadow</h1>

         <h3>Adds shadows to text.</h3>
        </header>
        <section>
            <h2 class="subtitle">Examples:</h2>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
