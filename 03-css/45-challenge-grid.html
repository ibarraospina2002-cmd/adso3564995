<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        section{
        h3.Gallery01 {
            display: none;
        }
        div.gallery {
        display: grid;
        grid-template-areas: "one two three"
                             "four two five"
                             "six six seven";
        grid-template-columns: 115px;
        grid-template-rows: 92px 92px ;
        grid-gap: 0.1rem;   
        width: 350px;
        height: 300px;
    
        div {
            width: 105px;
            height: 105px;
            padding: 0.2rem;

            &:first-child {
                background: url(imgs/gato.jpeg)no-repeat center / cover;
                grid-area: one;   
            }
            &:nth-child(2) {
                background: url(imgs/IMAGEN11.png) no-repeat center / cover;
                grid-area: two;
                height: calc(160px + 1.5rem);
            }
            &:nth-child(3) {
                background: url(imgs/mariposa.jpg)no-repeat center / cover;
                grid-area: three;
            }
            &:nth-child(4) {
                background: url(imgs/loro.jpg) no-repeat center / cover;
                grid-area: four;
            }
            &:nth-child(5) {
                background: url(imgs/puma.jpg) no-repeat center / cover;
                grid-area: five;
            }
            &:nth-child(6){
                background: url(imgs/colibri.jpg) no-repeat center / cover;
                width: calc(190px + 2rem);
                grid-area: six;
            }
            &:last-child {
                background: url(imgs/conejo\ 1.jpg) no-repeat center / cover;
                grid-area: seven;
            }
        }
    }

    div.gallery2 {
            display: grid;
            grid-template-areas: "one one two three"
                                 "one one four four"
                                 "five six four four";
            grid-template-columns: 89px 89px 89px 89px;
            grid-template-rows: 92px 92px 92px;
            grid-gap: 0.2rem;   
            width: 450px;
            height: 280px;

            div {
                width: 100%;
                height: 100%;
                margin: 0.3 auto;

            &:first-child {
            background: url(imgs/leon.jpg) no-repeat center / cover;
            grid-area: one;
           
            
            }
            &:nth-child(2) {
            grid-area: two;
            background: url(imgs/descarga.jpg)no-repeat center / cover;
            }
           &:nth-child(3) {
            grid-area: three;
            background: url(imgs/oso\ panda.jpg)no-repeat center / cover;
            }
            &:nth-child(4) {
            background: url(imgs/koala\ 🐨.jpg)no-repeat center / cover;
            grid-area: four;
            
            }
            &:nth-child(5) {
            grid-area: five;
            background: url(imgs/oso\ peresoso.jpg)no-repeat center / cover;
            }
            &:last-child {
            grid-area: six;
            background: url(imgs/jirafa.jpg)no-repeat center / cover;
            }
        }
    }
}  
    </style>
</head>
